[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Pipeline that extracts structured data from invoice files"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.0",
    "python-magic>=0.4",
    "charset-normalizer>=3.0",
    "anthropic>=0.40",
    "google-genai>=2.30.1",
    "streamlit>=1.65.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.0",
    "hypothesis>=6.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call real LLM APIs (need LLM_API_KEY)",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
strict = true
packages = ["invoice_extractor"]
mypy_path = "src"
